<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --surface-2:#EFEAE0;
    --ink:#25231F;
    --ink-soft:#726C61;
    --ink-faint:#A79F91;
    --line:#E3DACA;
    --accent:#2F6B5E;
    --accent-ink:#FFFFFF;
    --accent-2:#C9711F;
    --danger:#B0402F;
    --shadow:0 10px 30px -12px rgba(37,35,31,0.28);
    --radius:18px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1A17;
      --surface:#242220;
      --surface-2:#2E2B26;
      --ink:#F1ECE1;
      --ink-soft:#B8AF9F;
      --ink-faint:#7B7466;
      --line:#3B372F;
      --accent:#5FA491;
      --accent-ink:#12211D;
      --accent-2:#E0975A;
      --danger:#E08877;
      --shadow:0 10px 30px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1A17;
    --surface:#242220;
    --surface-2:#2E2B26;
    --ink:#F1ECE1;
    --ink-soft:#B8AF9F;
    --ink-faint:#7B7466;
    --line:#3B372F;
    --accent:#5FA491;
    --accent-ink:#12211D;
    --accent-2:#E0975A;
    --danger:#E08877;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
  }
  #app{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding-inline:16px;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  h1,h2,h3,.display{
    font-family:"Do Hyeon","Gowun Dodum",sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;font-size:15px;}
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- header ---------- */
  .app-header{
    flex:none;
    background:var(--bg);
    padding-top:14px;
    padding-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .app-title{font-size:22px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .app-title .mark{font-size:20px;}
  .me-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px 6px 6px;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    box-shadow:var(--shadow);
  }
  .me-chip .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex:none;}

  /* ---------- tabs ---------- */
  .tab-bar{
    flex:none;
    background:var(--bg);
    display:flex;
    gap:6px;
    padding-bottom:10px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:var(--surface-2);
    color:var(--ink-soft);
    padding:10px 8px;
    border-radius:12px;
    font-size:14.5px;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .tab-btn[aria-selected="true"]{
    background:var(--accent);
    color:var(--accent-ink);
  }

  /* ---------- member chip row ---------- */
  .member-row{
    flex:none;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    scrollbar-width:none;
  }
  .member-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:6px 12px 6px 6px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .15s, border-color .15s;
  }
  .chip .swatch{width:18px;height:18px;border-radius:50%;flex:none;}
  .chip.dim{opacity:0.38;}
  .chip.selected{border-color:var(--ink);}
  .chip.add-chip{border-style:dashed;color:var(--ink-soft);}
  .clear-filter{
    flex:none;
    align-self:center;
    background:none;border:none;
    color:var(--ink-faint);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px 4px;
  }

  main{
    display:block;
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  }
  .hidden{display:none!important;}

  /* ---------- calendar ---------- */
  .cal-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .cal-nav .month-label{font-size:19px;}
  .cal-nav .nav-btns{display:flex;gap:6px;align-items:center;}
  .icon-btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    width:32px;height:32px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:15px;
  }
  .today-btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    border-radius:10px;
    padding:0 10px;height:32px;
    font-size:13px;
    cursor:pointer;
  }
  .weekday-row{
    display:grid;grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    padding-bottom:6px;
  }
  .weekday-row span:first-child{color:#C1584A;}
  .weekday-row span:last-child{color:#4779A8;}
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    gap:3px;
  }
  .cal-cell{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    min-height:48px;
    min-width:0;
    overflow:hidden;
    padding:4px 3px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:3px;
    position:relative;
    transition:border-color .15s;
  }
  .cal-cell.outside{opacity:0.4;}
  .cal-cell.today{border-color:var(--accent);border-width:2px;padding:4px 3px;}
  .cal-cell.selected{background:var(--surface-2);border-color:var(--ink);}
  .cal-cell .daynum{font-size:12.5px;color:var(--ink-soft);}
  .cal-cell.today .daynum{color:var(--accent);font-weight:bold;}
  .ev-pill{
    font-size:10.5px;
    border-radius:6px;
    padding:1px 4px;
    color:#fff;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ev-more{font-size:10px;color:var(--ink-faint);}

  .day-panel{
    margin-top:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .day-panel .dp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .dp-head h3{font-size:17px;}

  /* ---------- lists (todos / notices) ---------- */
  .list-col{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .todo-item{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
  .todo-check{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
    flex:none;display:flex;align-items:center;justify-content:center;
    margin-top:1px;
    color:#fff;font-size:13px;
  }
  .todo-check.done{background:var(--accent);border-color:var(--accent);}
  .todo-body{flex:1;min-width:0;}
  .todo-text{font-size:15px;line-height:1.4;}
  .todo-text.done{color:var(--ink-faint);text-decoration:line-through;}
  .todo-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .mini-chip{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;color:var(--ink-soft);
    background:var(--surface-2);
    border-radius:999px;padding:2px 8px 2px 4px;
  }
  .mini-chip .dot-sm{width:12px;height:12px;border-radius:50%;}
  .due-tag{font-size:11px;color:var(--accent-2);background:var(--surface-2);border-radius:999px;padding:2px 8px;}

  .notice-card{cursor:pointer;}
  .notice-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .notice-text{font-size:15px;line-height:1.55;white-space:pre-wrap;}
  .notice-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .notice-time{font-size:11.5px;color:var(--ink-faint);}
  .pin-badge{font-size:11px;color:var(--accent-2);}

  /* ---------- empty states ---------- */
  .empty{
    text-align:center;
    padding:44px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-size:34px;margin-bottom:10px;}
  .empty h3{font-size:17px;color:var(--ink);margin-bottom:4px;}
  .empty p{font-size:13.5px;color:var(--ink-faint);margin:0;}

  /* ---------- fab ---------- */
  .fab{
    position:fixed;
    right:20px;
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-size:26px;
    box-shadow:var(--shadow);
    cursor:pointer;
    z-index:25;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,18,14,0.42);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
    padding:0;
  }
  @media (min-width:560px){
    .overlay{align-items:center;}
  }
  .modal-card{
    background:var(--surface);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow);
  }
  @media (min-width:560px){
    .modal-card{border-radius:20px;}
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h2{font-size:19px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-faint);cursor:pointer;padding:4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="time"],
  .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
  }
  .field textarea{resize:vertical;min-height:72px;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .chip-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .color-picker{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch-btn{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch-btn.picked{border-color:var(--ink);}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-ghost{background:var(--surface-2);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--danger);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .banner{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    line-height:1.5;
  }
  .banner.warn{border-color:var(--danger);color:var(--danger);}
  .banner code{
    background:var(--bg);
    border-radius:6px;
    padding:1px 5px;
    font-size:12px;
  }

  .setup-wrap{padding-top:32px;max-width:560px;margin:0 auto;}
  .setup-wrap ol{padding-left:20px;line-height:1.8;font-size:14px;color:var(--ink-soft);}
  .setup-wrap li{margin-bottom:6px;}
  .setup-wrap code{
    background:var(--surface-2);
    border-radius:6px;
    padding:2px 6px;
    font-size:12.5px;
  }

  @media (prefers-reduced-motion:no-preference){
    .chip,.tab-btn,.cal-cell{transition-duration:.15s;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="app-title"><span class="mark">🏡</span><h1>우리집 캘린더</h1></div>
    <div class="me-chip" id="me-chip" title="내 프로필 설정">
      <span class="dot" id="me-dot" style="background:var(--ink-faint);">?</span>
      <span id="me-label">나는 누구?</span>
    </div>
  </header>

  <nav class="tab-bar" role="tablist" id="tab-bar">
    <button class="tab-btn" role="tab" data-tab="calendar" aria-selected="true">캘린더</button>
    <button class="tab-btn" role="tab" data-tab="todos" aria-selected="false">할 일</button>
    <button class="tab-btn" role="tab" data-tab="notices" aria-selected="false">메모</button>
  </nav>

  <div class="member-row" id="member-row"></div>

  <main id="main">
    <section id="tab-calendar">
      <div class="cal-nav">
        <button class="icon-btn" id="cal-prev" aria-label="이전 달">‹</button>
        <div class="month-label display" id="month-label"></div>
        <div class="nav-btns">
          <button class="today-btn" id="cal-today">오늘</button>
          <button class="icon-btn" id="cal-next" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="weekday-row">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="day-panel hidden" id="day-panel"></div>
    </section>

    <section id="tab-todos" class="hidden">
      <div class="list-col" id="todo-list"></div>
    </section>

    <section id="tab-notices" class="hidden">
      <div class="list-col" id="notice-list"></div>
    </section>
  </main>
</div>

<button class="fab" id="fab" aria-label="추가">+</button>

<div id="modal-root"></div>

<script type="module">
  /* =====================================================================
     Firebase 연결 설정
     firebase 콘솔(console.firebase.google.com)에서 만든 프로젝트의
     "웹 앱" 설정값을 아래 firebaseConfig 자리에 붙여넣어 주세요.
     (자세한 방법은 함께 받은 설정 가이드를 참고하세요)
     ===================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyCPkyVdpwm0Lp0dnLxX57k0mdYXUhltBH4",
  authDomain: "ourhouse-calendar.firebaseapp.com",
  projectId: "ourhouse-calendar",
  storageBucket: "ourhouse-calendar.firebasestorage.app",
  messagingSenderId: "584407881165",
  appId: "1:584407881165:web:7afb7331414ebba07be084"
  };
  /* ===================================================================== */

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  var MEMBER_COLORS = ["#2F6B5E","#B54838","#3D6EA5","#8C5AA0","#B98A2E","#B15C7C"];

  var state = {
    tab: "calendar",
    monthCursor: new Date(),
    selectedDate: null,
    filterIds: new Set(),
    members: [],
    events: [],
    todos: [],
    notices: [],
    myId: null
  };

  function pad2(n){ return String(n).padStart(2,"0"); }
  function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function memberById(id){ return state.members.find(function(m){ return m.id===id; }); }

  function loadMyId(){
    try{ state.myId = localStorage.getItem("ourhouse_my_id") || null; }catch(e){ state.myId = null; }
  }
  function saveMyId(id){
    state.myId = id;
    try{ localStorage.setItem("ourhouse_my_id", id||""); }catch(e){}
    renderMeChip();
  }

  /* ---------------- Firebase / Firestore wiring ---------------- */
  var dbFS = null;

  function isConfigured(){
    return firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("YOUR_") !== 0;
  }

  function col(name){
    var ref = collection(dbFS, name);
    return {
      onSnapshot: function(next, err){ return onSnapshot(ref, next, err); },
      add: function(data){ return addDoc(ref, data); },
      doc: function(id){
        var dref = doc(dbFS, name, id);
        return {
          update: function(data){ return updateDoc(dref, data); },
          delete: function(){ return deleteDoc(dref); }
        };
      }
    };
  }

  function subscribe(colRef, cb){
    colRef.onSnapshot(function(snap){
      var rows = snap.docs.map(function(d){
        var data = d.data() || {};
        data.id = d.id;
        return data;
      });
      cb(rows);
    }, function(err){
      console.error("firestore error", err);
      showBanner("데이터를 불러오는 중 문제가 발생했어요. Firebase 설정값과 Firestore 보안 규칙을 확인해주세요.", true);
    });
  }

  function initDb(){
    if(!isConfigured()){
      showSetupScreen();
      return;
    }
    try{
      var app = initializeApp(firebaseConfig);
      dbFS = getFirestore(app);
    } catch(e){
      console.error(e);
      showBanner("Firebase 초기화에 실패했어요. firebaseConfig 값을 다시 확인해주세요.", true);
      return;
    }
    subscribe(col("members"), function(rows){
      state.members = rows.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      renderMemberRow();
      renderMeChip();
      renderAll();
    });
    subscribe(col("events"), function(rows){
      state.events = rows;
      renderCalendar();
      if(state.selectedDate) renderDayPanel();
    });
    subscribe(col("todos"), function(rows){
      state.todos = rows;
      renderTodos();
    });
    subscribe(col("notices"), function(rows){
      state.notices = rows;
      renderNotices();
    });
  }

  function showBanner(msg, warn){
    var main = document.getElementById("main");
    var existing = document.getElementById("db-banner");
    if(existing) existing.remove();
    var div = document.createElement("div");
    div.id = "db-banner";
    div.className = "banner"+(warn?" warn":"");
    div.textContent = msg;
    main.prepend(div);
  }

  function showSetupScreen(){
    document.getElementById("fab").classList.add("hidden");
    document.getElementById("tab-bar").classList.add("hidden");
    document.getElementById("member-row").classList.add("hidden");
    document.getElementById("main").innerHTML =
      '<div class="setup-wrap">' +
      '<h2 style="font-size:20px;margin-bottom:10px;">설정이 아직 안 끝났어요</h2>' +
      '<p style="font-size:14px;color:var(--ink-soft);line-height:1.6;">' +
      'index.html 파일 안의 <code>firebaseConfig</code> 값을 Firebase 콘솔에서 만든 값으로 바꿔주면 앱이 바로 열려요. ' +
      '함께 받은 설정 가이드를 따라 하면 5~10분이면 끝나요.</p>' +
      '<ol>' +
      '<li><code>console.firebase.google.com</code>에서 새 프로젝트를 만들어요.</li>' +
      '<li>Firestore Database를 만들고 보안 규칙을 설정해요.</li>' +
      '<li>"웹 앱 추가"로 나오는 <code>firebaseConfig</code> 값을 복사해요.</li>' +
      '<li>index.html 위쪽의 firebaseConfig 자리에 붙여넣고 저장해요.</li>' +
      '<li>파일을 다시 열거나, 호스팅한 링크를 새로고침해요.</li>' +

  /* ---------------- member row (filter + add) ---------------- */
  function renderMemberRow(){
    var row = document.getElementById("member-row");

      var dim = state.filterIds.size>0 && !state.filterIds.has(m.id);

  function passesFilter(memberIds){
    if(state.filterIds.size===0) return true;
    if(!memberIds || !memberIds.length) return false;
    return memberIds.some(function(id){ return state.filterIds.has(id); });
  }

  /* ---------------- calendar ---------------- */
  var MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

  function buildMonthGrid(year, month){
    var first = new Date(year, month, 1);
    var startOffset = first.getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var prevMonthDays = new Date(year, month, 0).getDate();
    var cells = [];
    for(var i=startOffset-1;i>=0;i--){
      cells.push({date:new Date(year, month-1, prevMonthDays-i), outside:true});
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({date:new Date(year, month, d), outside:false});
    }
    while(cells.length % 7 !== 0){
      var last = cells[cells.length-1].date;
      var next = new Date(last.getFullYear(), last.getMonth(), last.getDate()+1);
      cells.push({date: next, outside:true});
    }
    return cells;
  }

  function eventsOn(dateStr){
    return state.events
      .filter(function(ev){ return ev.date===dateStr && passesFilter(ev.memberIds); })
      .sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); });
  }

  function renderCalendar(){
    var y = state.monthCursor.getFullYear();
    var m = state.monthCursor.getMonth();
    document.getElementById("month-label").textContent = y+"년 "+MONTH_NAMES[m];
    var grid = document.getElementById("cal-grid");
    var cells = buildMonthGrid(y,m);
    var today = todayStr();
    var html = "";
    cells.forEach(function(cell){
      var ds = ymd(cell.date);
      var evs = eventsOn(ds);
      var cls = "cal-cell";
      if(cell.outside) cls += " outside";
      if(ds===today) cls += " today";
      if(ds===state.selectedDate) cls += " selected";
      html += '<div class="'+cls+'" data-date="'+ds+'">';
      html += '<span class="daynum tabular">'+cell.date.getDate()+'</span>';
      var shown = evs.slice(0,3);
      shown.forEach(function(ev){
        var color = "var(--accent)";
        if(ev.memberIds && ev.memberIds.length){
          var mm = memberById(ev.memberIds[0]);
          if(mm) color = mm.color;
        }
        html += '<span class="ev-pill" style="background:'+color+'">'+esc(ev.title)+'</span>';
      });
      if(evs.length>3){
        html += '<span class="ev-more">+'+(evs.length-3)+'개 더</span>';
      }
      html += '</div>';
    });
    grid.innerHTML = html;
    grid.querySelectorAll(".cal-cell").forEach(function(el){
      el.addEventListener("click", function(){
        state.selectedDate = el.dataset.date;
        renderCalendar();
        renderDayPanel();
      });
    });
  }

  function renderDayPanel(){
    var panel = document.getElementById("day-panel");
    if(!state.selectedDate){ panel.classList.add("hidden"); return; }
    panel.classList.remove("hidden");
    var d = new Date(state.selectedDate+"T00:00:00");
    var wk = ["일","월","화","수","목","금","토"][d.getDay()];
    var evs = eventsOn(state.selectedDate);
    var html = '<div class="dp-head"><h3>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wk+')</h3>'+
      '<button class="icon-btn" id="dp-add" aria-label="일정 추가">+</button></div>';
    if(evs.length===0){
      html += '<div class="empty"><div class="big">🗓️</div><h3>등록된 일정이 없어요</h3><p>+ 버튼으로 일정을 추가해보세요</p></div>';
    } else {
      html += '<div class="list-col">';
      evs.forEach(function(ev){
        html += '<div class="card" data-evid="'+ev.id+'" style="cursor:pointer;">';
        html += '<div style="display:flex;justify-content:space-between;gap:8px;">';
        html += '<div><div style="font-size:15px;">'+(ev.time? '<span class="tabular" style="color:var(--ink-soft);margin-right:6px;">'+esc(ev.time)+'</span>':'')+esc(ev.title)+'</div>';
        if(ev.memo){ html += '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">'+esc(ev.memo)+'</div>'; }
        html += '</div></div>';
        if(ev.memberIds && ev.memberIds.length){
          html += '<div class="todo-meta">'+ev.memberIds.map(function(id){
            var mm = memberById(id);
            if(!mm) return "";
            return '<span class="mini-chip"><span class="dot-sm" style="background:'+mm.color+'"></span>'+esc(mm.name)+'</span>';
          }).join("")+'</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    }
    panel.innerHTML = html;
    var addBtn = document.getElementById("dp-add");
    if(addBtn) addBtn.addEventListener("click", function(){ openEventModal(null, state.selectedDate); });
    panel.querySelectorAll("[data-evid]").forEach(function(el){
      el.addEventListener("click", function(){
        var ev = state.events.find(function(x){ return x.id===el.dataset.evid; });
        if(ev) openEventModal(ev, ev.date);
      });
    });
  }

  document.getElementById("cal-prev").addEventListener("click", function(){
    state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()-1, 1);
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", function(){
    state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()+1, 1);
    renderCalendar();
  });
  document.getElementById("cal-today").addEventListener("click", function(){
    state.monthCursor = new Date();
    state.selectedDate = todayStr();
    renderCalendar();
    renderDayPanel();
  });

  /* ---------------- todos ---------------- */
  function renderTodos(){
    var wrap = document.getElementById("todo-list");
    var rows = state.todos.filter(function(t){ return passesFilter(t.memberIds); });
    rows.sort(function(a,b){
      if(!!a.done !== !!b.done) return a.done ? 1 : -1;
      return (a.createdAt||0)-(b.createdAt||0);
    });
    if(rows.length===0){
      wrap.innerHTML = '<div class="empty"><div class="big">✅</div><h3>할 일이 없어요</h3><p>+ 버튼으로 할 일을 추가해보세요</p></div>';
      return;
    }
    var html = "";
    rows.forEach(function(t){
      html += '<div class="card todo-item" data-tid="'+t.id+'">';
      html += '<span class="todo-check'+(t.done?' done':'')+'" data-check="'+t.id+'">'+(t.done?'✓':'')+'</span>';
      html += '<div class="todo-body">';
      html += '<div class="todo-text'+(t.done?' done':'')+'">'+esc(t.text)+'</div>';
      var metas = [];
      if(t.dueDate){ metas.push('<span class="due-tag tabular">'+esc(t.dueDate)+'</span>'); }
      if(t.memberIds && t.memberIds.length){
        t.memberIds.forEach(function(id){
          var mm = memberById(id);
          if(mm) metas.push('<span class="mini-chip"><span class="dot-sm" style="background:'+mm.color+'"></span>'+esc(mm.name)+'</span>');
        });
      }
      if(metas.length) html += '<div class="todo-meta">'+metas.join("")+'</div>';
      html += '</div></div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll("[data-check]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var t = state.todos.find(function(x){ return x.id===el.dataset.check; });
        if(t) col("todos").doc(t.id).update({done: !t.done});
      });
    });
    wrap.querySelectorAll(".todo-item").forEach(function(el){
      el.addEventListener("click", function(){
        var t = state.todos.find(function(x){ return x.id===el.dataset.tid; });
        if(t) openTodoModal(t);
      });
    });
  }

  /* ---------------- notices ---------------- */
  function renderNotices(){
    var wrap = document.getElementById("notice-list");
    var rows = state.notices.slice().sort(function(a,b){
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt||0)-(a.createdAt||0);
    });
    if(rows.length===0){
      wrap.innerHTML = '<div class="empty"><div class="big">📌</div><h3>공유 메모가 없어요</h3><p>+ 버튼으로 가족에게 전할 메모를 남겨보세요</p></div>';
      return;
    }
    var html = "";
    rows.forEach(function(n){
      var author = n.memberId ? memberById(n.memberId) : null;
      var dt = n.createdAt ? new Date(n.createdAt) : null;
      var dtStr = dt ? (dt.getMonth()+1)+"."+dt.getDate()+" "+pad2(dt.getHours())+":"+pad2(dt.getMinutes()) : "";
      html += '<div class="card notice-card" data-nid="'+n.id+'">';
      html += '<div class="notice-top">';
      html += author ? '<span class="mini-chip"><span class="dot-sm" style="background:'+author.color+'"></span>'+esc(author.name)+'</span>' : '<span class="mini-chip">가족 전체</span>';
      if(n.pinned) html += '<span class="pin-badge">📌 고정</span>';
      html += '</div>';
      html += '<div class="notice-text">'+esc(n.text)+'</div>';
      html += '<div class="notice-foot"><span class="notice-time tabular">'+dtStr+'</span></div>';
      html += '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".notice-card").forEach(function(el){
      el.addEventListener("click", function(){
        var n = state.notices.find(function(x){ return x.id===el.dataset.nid; });
        if(n) openNoticeModal(n);
      });

  function renderAll(){
    renderCalendar();
    if(state.selectedDate) renderDayPanel();
    renderTodos();
    renderNotices();

  /* ---------------- fab ---------------- */
  document.getElementById("fab").addEventListener("click", function(){
    if(state.members.length===0){ openMemberModal(null); return; }
    if(state.tab==="calendar") openEventModal(null, state.selectedDate || todayStr());
    else if(state.tab==="todos") openTodoModal(null);
    else openNoticeModal(null);

  /* ---------------- modal shell ---------------- */
  function openModal(innerHtml, opts){
    opts = opts || {};
    var root = document.getElementById("modal-root");
    var closable = opts.closable !== false;
    root.innerHTML = '<div class="overlay" id="ov"><div class="modal-card" id="mc">'+innerHtml+'</div></div>';
    if(closable){
      document.getElementById("ov").addEventListener("click", function(e){
        if(e.target.id==="ov") closeModal();
      });
    }
    return document.getElementById("mc");
  }
  function closeModal(){
    document.getElementById("modal-root").innerHTML = "";
  }

  function chipPickerHtml(selectedIds, idPrefix){
    var html = '<div class="chip-picker" id="'+idPrefix+'">';
    state.members.forEach(function(m){
      var sel = selectedIds.indexOf(m.id)>=0;
      html += '<div class="chip'+(sel?' selected':'')+'" data-pick="'+m.id+'">'+
        '<span class="swatch" style="background:'+m.color+'"></span>'+esc(m.name)+'</div>';
    });
    if(state.members.length===0){
      html += '<span style="font-size:12.5px;color:var(--ink-faint);">먼저 가족 구성원을 추가해주세요</span>';
    }
    html += '</div>';
    return html;
  }
  function wireChipPicker(container, selectedSet){
    container.querySelectorAll(".chip[data-pick]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.dataset.pick;
        if(selectedSet.has(id)) selectedSet.delete(id); else selectedSet.add(id);
        el.classList.toggle("selected");
      });
    });
  }

  /* ---------------- member modal ---------------- */
  function openMemberModal(existing){
    var picked = existing ? existing.color : nextColor();
    var card = openModal(
      '<div class="modal-head"><h2>'+(existing?'구성원 수정':'구성원 추가')+'</h2><button class="modal-close" id="m-close">×</button></div>'+
      '<div class="field"><label for="mem-name">이름</label><input type="text" id="mem-name" placeholder="예: 엄마" value="'+(existing?esc(existing.name):'')+'" maxlength="12"></div>'+
      '<div class="field"><label>색상</label><div class="color-picker" id="mem-colors"></div></div>'+
      '<div class="modal-actions">'+
        (existing? '<button class="btn btn-danger" id="mem-delete">삭제</button>':'')+
        '<button class="btn btn-ghost" id="mem-cancel">취소</button>'+
        '<button class="btn btn-primary" id="mem-save">저장</button>'+
      '</div>',
      {closable: state.members.length>0}
    );
    var colorsWrap = card.querySelector("#mem-colors");
    var chosen = picked;
    MEMBER_COLORS.forEach(function(c){
      var b = document.createElement("button");
      b.type="button";
      b.className = "swatch-btn"+(c===chosen?" picked":"");
      b.style.background = c;
      b.addEventListener("click", function(){
        chosen = c;
        colorsWrap.querySelectorAll(".swatch-btn").forEach(function(x){ x.classList.remove("picked"); });
        b.classList.add("picked");
      });
      colorsWrap.appendChild(b);
    });
    card.querySelector("#m-close").addEventListener("click", closeModal);
    var cancelBtn = card.querySelector("#mem-cancel");
    if(cancelBtn) cancelBtn.addEventListener("click", closeModal);
    var delBtn = card.querySelector("#mem-delete");
    if(delBtn) delBtn.addEventListener("click", function(){
      openConfirm("구성원을 삭제할까요? 이 구성원이 배정된 일정/할 일은 남아있어요.", function(){
        col("members").doc(existing.id).delete();
        if(state.myId===existing.id) saveMyId(null);
        closeModal();
      });
    });
    card.querySelector("#mem-save").addEventListener("click", function(){
      var name = card.querySelector("#mem-name").value.trim();
      if(!name) return;
      if(existing){
        col("members").doc(existing.id).update({name: name, color: chosen});
      } else {
        col("members").add({name:name, color:chosen, createdAt: Date.now()}).then(function(ref){
          if(!state.myId) saveMyId(ref.id);
        });
      }
      closeModal();
    });
  }
  function nextColor(){
    var used = {};
    state.members.forEach(function(m){ used[m.color]=(used[m.color]||0)+1; });
    var best = MEMBER_COLORS[0], bestCount = Infinity;
    MEMBER_COLORS.forEach(function(c){
      var n = used[c]||0;
      if(n<bestCount){ bestCount=n; best=c; }
    });
    return best;
  }

  /* ---------------- identity modal ---------------- */
  function openIdentityModal(){
    var html = '<div class="modal-head"><h2>나는 누구인가요?</h2><button class="modal-close" id="id-close">×</button></div>';

          '<span class="swatch" style="background:'+m.color+'"></span>'+esc(m.name)+'</div>';

  /* ---------------- event modal ---------------- */
  function openEventModal(existing, prefillDate){
    var selected = new Set(existing ? (existing.memberIds||[]) : (state.myId?[state.myId]:[]));
    var hasTime = existing ? !!existing.time : false;
    var html = '<div class="modal-head"><h2>'+(existing?'일정 수정':'일정 추가')+'</h2><button class="modal-close" id="ev-close">×</button></div>'+
      '<div class="field"><label for="ev-title">제목</label><input type="text" id="ev-title" placeholder="예: 병원 예약" value="'+(existing?esc(existing.title):'')+'" maxlength="60"></div>'+
      '<div class="field"><label for="ev-date">날짜</label><input type="date" id="ev-date" value="'+(existing?existing.date:(prefillDate||todayStr()))+'"></div>'+
      '<div class="toggle-row"><input type="checkbox" id="ev-time-toggle" '+(hasTime?'checked':'')+'><label for="ev-time-toggle" style="margin:0;">시간 지정하기</label></div>'+
      '<div class="field" id="ev-time-field" style="'+(hasTime?'':'display:none;')+'"><label for="ev-time">시간</label><input type="time" id="ev-time" value="'+(existing&&existing.time?existing.time:'')+'"></div>'+
      '<div class="field"><label>담당자</label>'+chipPickerHtml(Array.from(selected), "ev-chips")+'</div>'+
      '<div class="field"><label for="ev-memo">메모 (선택)</label><textarea id="ev-memo" maxlength="200">'+(existing&&existing.memo?esc(existing.memo):'')+'</textarea></div>'+
      '<div class="modal-actions">'+
        (existing? '<button class="btn btn-danger" id="ev-delete">삭제</button>':'')+
        '<button class="btn btn-ghost" id="ev-cancel">취소</button>'+
        '<button class="btn btn-primary" id="ev-save">저장</button>'+
      '</div>';
    var card = openModal(html);
    wireChipPicker(card.querySelector("#ev-chips"), selected);
    card.querySelector("#ev-close").addEventListener("click", closeModal);
    card.querySelector("#ev-cancel").addEventListener("click", closeModal);
    card.querySelector("#ev-time-toggle").addEventListener("change", function(e){
      card.querySelector("#ev-time-field").style.display = e.target.checked ? "" : "none";
    });
    var delBtn = card.querySelector("#ev-delete");
    if(delBtn) delBtn.addEventListener("click", function(){
      openConfirm("이 일정을 삭제할까요?", function(){
        col("events").doc(existing.id).delete();
        closeModal();
      });
    });
    card.querySelector("#ev-save").addEventListener("click", function(){
      var title = card.querySelector("#ev-title").value.trim();
      var date = card.querySelector("#ev-date").value;
      if(!title || !date) return;
      var useTime = card.querySelector("#ev-time-toggle").checked;
      var time = useTime ? card.querySelector("#ev-time").value : "";
      var memo = card.querySelector("#ev-memo").value.trim();
      var payload = {title:title, date:date, time:time, memberIds:Array.from(selected), memo:memo};
      if(existing){
        col("events").doc(existing.id).update(payload);
      } else {
        payload.createdAt = Date.now();
        col("events").add(payload);
      }
      state.selectedDate = date;
      closeModal();
    });
  }

  /* ---------------- todo modal ---------------- */
  function openTodoModal(existing){
    var selected = new Set(existing ? (existing.memberIds||[]) : (state.myId?[state.myId]:[]));
    var hasDue = existing ? !!existing.dueDate : false;
    var html = '<div class="modal-head"><h2>'+(existing?'할 일 수정':'할 일 추가')+'</h2><button class="modal-close" id="td-close">×</button></div>'+
      '<div class="field"><label for="td-text">내용</label><input type="text" id="td-text" placeholder="예: 우유 사오기" value="'+(existing?esc(existing.text):'')+'" maxlength="80"></div>'+
      '<div class="toggle-row"><input type="checkbox" id="td-due-toggle" '+(hasDue?'checked':'')+'><label for="td-due-toggle" style="margin:0;">기한 지정하기</label></div>'+
      '<div class="field" id="td-due-field" style="'+(hasDue?'':'display:none;')+'"><label for="td-due">기한</label><input type="date" id="td-due" value="'+(existing&&existing.dueDate?existing.dueDate:'')+'"></div>'+
      '<div class="field"><label>담당자</label>'+chipPickerHtml(Array.from(selected), "td-chips")+'</div>'+
      '<div class="modal-actions">'+
        (existing? '<button class="btn btn-danger" id="td-delete">삭제</button>':'')+
        '<button class="btn btn-ghost" id="td-cancel">취소</button>'+
        '<button class="btn btn-primary" id="td-save">저장</button>'+
      '</div>';
    var card = openModal(html);
    wireChipPicker(card.querySelector("#td-chips"), selected);
    card.querySelector("#td-close").addEventListener("click", closeModal);
    card.querySelector("#td-cancel").addEventListener("click", closeModal);
    card.querySelector("#td-due-toggle").addEventListener("change", function(e){
      card.querySelector("#td-due-field").style.display = e.target.checked ? "" : "none";
    });
    var delBtn = card.querySelector("#td-delete");
    if(delBtn) delBtn.addEventListener("click", function(){
      openConfirm("이 할 일을 삭제할까요?", function(){
        col("todos").doc(existing.id).delete();
        closeModal();
      });
    });
    card.querySelector("#td-save").addEventListener("click", function(){
      var text = card.querySelector("#td-text").value.trim();
      if(!text) return;
      var useDue = card.querySelector("#td-due-toggle").checked;
      var due = useDue ? card.querySelector("#td-due").value : "";
      var payload = {text:text, dueDate:due, memberIds:Array.from(selected)};
      if(existing){
        col("todos").doc(existing.id).update(payload);
      } else {
        payload.done = false;
        payload.createdAt = Date.now();
        col("todos").add(payload);
      }
      closeModal();
    });
  }

  /* ---------------- notice modal ---------------- */
  function openNoticeModal(existing){
    var authorId = existing ? (existing.memberId||"") : (state.myId||"");
    var pinned = existing ? !!existing.pinned : false;
    var html = '<div class="modal-head"><h2>'+(existing?'메모 수정':'메모 남기기')+'</h2><button class="modal-close" id="nt-close">×</button></div>'+
      '<div class="field"><label for="nt-text">내용</label><textarea id="nt-text" placeholder="가족에게 전할 말을 남겨보세요" maxlength="300">'+(existing?esc(existing.text):'')+'</textarea></div>'+
      '<div class="field"><label>작성자</label><div class="chip-picker" id="nt-author">'+
        '<div class="chip'+(!authorId?' selected':'')+'" data-author="">가족 전체</div>'+
        state.members.map(function(m){
          return '<div class="chip'+(authorId===m.id?' selected':'')+'" data-author="'+m.id+'"><span class="swatch" style="background:'+m.color+'"></span>'+esc(m.name)+'</div>';
        }).join("")+
      '</div></div>'+
      '<div class="toggle-row"><input type="checkbox" id="nt-pin" '+(pinned?'checked':'')+'><label for="nt-pin" style="margin:0;">상단에 고정하기</label></div>'+
      '<div class="modal-actions">'+
        (existing? '<button class="btn btn-danger" id="nt-delete">삭제</button>':'')+
        '<button class="btn btn-ghost" id="nt-cancel">취소</button>'+
        '<button class="btn btn-primary" id="nt-save">저장</button>'+
      '</div>';
    var card = openModal(html);
    var chosenAuthor = authorId;
    card.querySelectorAll("#nt-author [data-author]").forEach(function(el){
      el.addEventListener("click", function(){
        chosenAuthor = el.dataset.author;
        card.querySelectorAll("#nt-author .chip").forEach(function(x){ x.classList.remove("selected"); });
        el.classList.add("selected");
      });
    });
    card.querySelector("#nt-close").addEventListener("click", closeModal);
    card.querySelector("#nt-cancel").addEventListener("click", closeModal);
    var delBtn = card.querySelector("#nt-delete");
    if(delBtn) delBtn.addEventListener("click", function(){
      openConfirm("이 메모를 삭제할까요?", function(){
        col("notices").doc(existing.id).delete();
        closeModal();
      });
    });
    card.querySelector("#nt-save").addEventListener("click", function(){
      var text = card.querySelector("#nt-text").value.trim();
      if(!text) return;
      var pin = card.querySelector("#nt-pin").checked;
      var payload = {text:text, memberId:chosenAuthor, pinned:pin};
      if(existing){
        col("notices").doc(existing.id).update(payload);
      } else {
        payload.createdAt = Date.now();
        col("notices").add(payload);
      }
      closeModal();
    });
  }

  /* ---------------- confirm ---------------- */
  function openConfirm(message, onConfirm){
    var card = openModal(
      '<div class="modal-head"><h2>확인</h2></div>'+
      '<p style="font-size:14.5px;color:var(--ink-soft);line-height:1.5;">'+esc(message)+'</p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cf-cancel">취소</button>'+
        '<button class="btn btn-primary" id="cf-ok" style="background:var(--danger);">삭제</button>'+
      '</div>'
    );
    card.querySelector("#cf-cancel").addEventListener("click", closeModal);
    card.querySelector("#cf-ok").addEventListener("click", onConfirm);
  }

  /* ---------------- boot ---------------- */
  loadMyId();
  state.selectedDate = todayStr();
  renderCalendar();
  renderDayPanel();
  initDb();
</script>
</body>
</html>
